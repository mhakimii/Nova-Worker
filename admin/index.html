<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Admin</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f0f9ff;color:#0f172a}#s{opacity:.7}</style>
</head>
<body>
<p id="s">در حال بارگذاری پنل...</p>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/mhakimii/Nova-Worker@689bd20c19ad214c965f690ac20730c6c0ea04d3/admin/index.html',
    'https://raw.githubusercontent.com/mhakimii/Nova-Worker/689bd20c19ad214c965f690ac20730c6c0ea04d3/admin/index.html'
  ];
  var lastErr;
  for (var i = 0; i < urls.length; i++) {
    try {
      var r = await fetch(urls[i], { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var html = await r.text();
      if (html.length < 10000) throw new Error('too short');
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) { lastErr = e; }
  }
  document.getElementById('s').textContent = 'خطا در بارگذاری پنل. لطفاً تاریخچه گیت را بازگردانی کنید. ' + (lastErr && lastErr.message);
})();
</script>
</body>
</html>
