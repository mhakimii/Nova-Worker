          git apply -p1 /tmp/change.diff
          cp installer/src/index.js /tmp/check.mjs
          node --check /tmp/check.mjs
          got=$(git hash-object installer/src/index.js)
          echo "resulting hash: $got"
          if [ "$got" != "01c167cafd896af937ec11236e395dd12c2c67e2" ]; then
            echo "::error::hash mismatch after patch"
            exit 1
          fi

      - name: commit
        run: |
          set -euo pipefail
          cat > /tmp/msg.txt <<'MSG'
          fix(installer): return to the install page path after login

          The callback redirected to the origin root instead of the page path, so users
          landed outside /Nova-Worker/. The full return path is stored with the state
          and reused after the token exchange. A denied authorization now returns to
          the page instead of raw JSON.
          MSG
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/src/index.js
          git commit -F /tmp/msg.txt
          git push

      - name: cleanup
        run: |
          set -euo pipefail
          git rm -q .github/workflows/patch-installer.yml
          git commit -m "chore: remove one-off installer patch workflow"
          git push
