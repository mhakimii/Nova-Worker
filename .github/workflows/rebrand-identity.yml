name: rebrand-identity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply rebrand
        run: node scripts/rebrand.mjs _worker.js

      - name: Syntax check
        run: node --check _worker.js

      - name: Show change
        run: |
          git --no-pager diff --stat
          git --no-pager diff --word-diff=plain --unified=0
          sha256sum _worker.js

      - name: Commit
        run: |
          git config user.name "Nova Worker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add _worker.js
          git commit -m "chore: rebrand edgetunnel identity strings to Nova Worker Beta"
          git push origin HEAD:refs/heads/main
