name: add-license

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GPL-2.0
        run: |
          for url in \
            "https://raw.githubusercontent.com/cmliu/edgetunnel/main/LICENSE" \
            "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-2.0-only.txt"; do
            if curl -fsSL --connect-timeout 15 --max-time 60 "$url" -o LICENSE; then
              echo "fetched: $url"
              break
            fi
          done
          head -3 LICENSE
          wc -c LICENSE
          sha256sum LICENSE

      - name: Commit
        run: |
          git config user.name "Nova Worker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add LICENSE
          git commit -m "docs: add GPL-2.0 license text"
          git push origin HEAD:refs/heads/main
