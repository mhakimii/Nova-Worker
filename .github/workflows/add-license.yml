name: add-license

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GPL-2.0
        run: |
          curl -fsSL https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt -o LICENSE
          head -3 LICENSE
          wc -c LICENSE
          sha256sum LICENSE

      - name: Commit
        run: |
          git config user.name "Nova Worker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add LICENSE
          git commit -m "docs: add GPL-2.0 license text"
          git push origin HEAD:refs/heads/main
