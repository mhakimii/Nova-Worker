# کانفیگ پنل اصلی — دکمه‌ی «Deploy to Cloudflare» و wrangler از همین می‌خوانند.
name = "nova-worker"
main = "_worker.js"
compatibility_date = "2026-10-08"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
# در نصب یک‌کلیکی، Cloudflare خودش فضای KV را می‌سازد و این شناسه را جایگزین می‌کند.
id = "00000000000000000000000000000000"

[observability]
enabled = true
